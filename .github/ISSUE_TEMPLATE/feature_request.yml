name: 功能建议
description: 提一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景，而不只是想要的方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过
